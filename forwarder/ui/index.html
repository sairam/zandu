<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zandu Forwarder</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="" width="32" height="32">
      <span>Zandu <strong>Forwarder</strong></span>
    </div>
    <nav id="tabs" hidden>
      <button data-tab="clients">Clients</button>
      <button data-tab="policies">Policies</button>
      <button data-tab="upstreams">Upstreams</button>
      <button data-tab="issuers">Issuers</button>
      <button data-tab="test">Test</button>
      <button data-tab="audit">Audit</button>
    </nav>
    <button id="logout" class="ghost" hidden>Sign out</button>
  </header>

  <main>
    <section id="login" class="panel narrow" hidden>
      <h1>Sign in</h1>
      <p class="muted">Enter the admin token configured with <code>ZANDU_ADMIN_TOKEN</code>.</p>
      <form id="login-form">
        <label>Admin token <input type="password" name="token" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
        <p class="error" id="login-error"></p>
      </form>
    </section>
    <div id="view"></div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
